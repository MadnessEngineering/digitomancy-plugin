[project]
name = "digitomancy"
version = "0.1.0"
description = "Divination by fingers — Android automation workshop: anchors, checkpoints, routines, Tasker bridge, MCP."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "uiautomator2>=3.2",
    "pyyaml>=6",
    "fastmcp>=2.10",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9", "numpy>=1.26"]

[project.scripts]
dgm = "digitomancy.cli:main"
digitomancy-mcp = "digitomancy.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digitomancy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Rebuild when source changes, not just pyproject — the plugin runs this via
# `uvx --from <plugin>/server`, and stale cached builds would hide updates.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/starter/**" }]
